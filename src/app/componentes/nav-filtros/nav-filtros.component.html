<section class="seccao-filtro">
  <p>Organizar por:</p>
  <ul>
    @for (botao of listaBotoes; track botao.id) {
      <li><button
        class="filtro-btn"
        [class.btn-ativo]="botaoSelecionado === botao.id"
        (click)="botao.acao(); botaoSelecionado = botao.id"
        > {{ botao.nome }}
      </button></li>
    }
  </ul>
</section>
