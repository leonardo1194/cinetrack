<section class="card-filme container">
  <div class="capa">
    <img [src]="filme().capa" alt="">
  </div>
  <div class="info-filme">
    <h2 class="texto-titulo">{{filme().titulo}}</h2>
    <div>
      <h3 class="texto-ano">{{filme().ano}}</h3>
      <button class="favorito" (click)="alternarFavorito()">
        <span>{{ filme().favorito === false ? '&#9734;' : '&#9733;' }}</span>
      </button>
    </div>
  </div>
</section>
